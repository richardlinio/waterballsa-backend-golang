name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".air.toml"
      - "Makefile"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".air.toml"
      - "Makefile"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      image: golang:1.25-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Install dependencies
        run: |
          apk add --no-cache git curl bash
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.7.2

      - name: Run golangci-lint
        run: golangci-lint run --config .golangci.yml

  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: golang:1.25-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Install dependencies
        run: apk add --no-cache git gcc musl-dev

      - name: Run tests
        env:
          CGO_ENABLED: 1
        run: go test -v -race ./...

  generated-code:
    name: Generated Code Sync
    runs-on: ubuntu-latest
    container:
      image: golang:1.25-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Cache sqlc binary
        uses: actions/cache@v4
        with:
          path: /go/bin/sqlc
          key: ${{ runner.os }}-sqlc-v1.30.0

      - name: Install dependencies
        run: apk add --no-cache git

      - name: Install sqlc
        run: |
          if [ ! -f /go/bin/sqlc ]; then
            go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          fi

      - name: Check generated code is in sync
        run: |
          if [ -f sqlc.yaml ] || [ -f sqlc.yml ]; then
            sqlc diff
          else
            echo "No sqlc configuration found, skipping..."
          fi

      - name: Lint SQL queries
        run: |
          if [ -f sqlc.yaml ] || [ -f sqlc.yml ]; then
            sqlc vet
          else
            echo "No sqlc configuration found, skipping..."
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: golang:1.25-alpine
    needs: [test, lint, generated-code]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: Install dependencies
        run: apk add --no-cache git

      - name: Build
        run: go build -v ./...
