name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".air.toml"
      - "Makefile"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".air.toml"
      - "Makefile"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - name: Run tests
        run: go test -v -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.7.2
          args: --config .golangci.yml

  generated-code:
    name: Generated Code Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - name: Check sqlc requirements
        # 檢查專案根目錄是否存在 sqlc 設定檔（sqlc.yaml 或 sqlc.yml）
        # 如果存在，設定輸出變數 enabled=true，後續步驟會依此判斷是否執行
        # 如果不存在，設定 enabled=false，後續 sqlc 相關步驟會被跳過
        id: check-sqlc
        run: |
          if [ -f "sqlc.yaml" ] || [ -f "sqlc.yml" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "✓ sqlc configuration found"
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "ℹ️ sqlc not configured, skipping database code generation checks"
          fi

      - name: Cache Go tools
        if: steps.check-sqlc.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-sqlc-v1.30.0
          restore-keys: |
            ${{ runner.os }}-go-tools-sqlc-

      - name: Install sqlc
        # 只有當 sqlc 設定檔存在時才安裝
        if: steps.check-sqlc.outputs.enabled == 'true'
        run: |
          if ! command -v sqlc &> /dev/null; then
            go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          fi

      - name: Check generated code is in sync
        # 只有當 sqlc 設定檔存在時才執行檢查
        # sqlc diff: 比對從 .sql 檔案產生的程式碼和現存檔案是否一致
        # 如果不一致，表示開發者忘記執行 sqlc generate
        if: steps.check-sqlc.outputs.enabled == 'true'
        run: sqlc diff

      - name: Lint SQL queries
        # 只有當 sqlc 設定檔存在時才執行 lint
        # sqlc vet: 對 SQL 查詢運行 lint 規則，提早發現反模式（anti-patterns）
        if: steps.check-sqlc.outputs.enabled == 'true'
        run: sqlc vet

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, generated-code]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - name: Build
        run: go build -v ./...
